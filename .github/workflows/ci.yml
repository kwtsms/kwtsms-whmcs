name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, intl
          tools: composer:v2

      - name: Install dependencies
        working-directory: modules/addons/kwtsms
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        working-directory: modules/addons/kwtsms
        run: vendor/bin/phpstan analyse

      - name: PHPCS
        working-directory: modules/addons/kwtsms
        run: vendor/bin/phpcs --standard=phpcs.xml

  test:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, intl
          tools: composer:v2

      - name: Install dependencies
        working-directory: modules/addons/kwtsms
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        working-directory: modules/addons/kwtsms
        run: vendor/bin/phpunit --testsuite Unit

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        working-directory: modules/addons/kwtsms
        run: composer install --no-interaction --prefer-dist

      - name: Check for known vulnerabilities
        working-directory: modules/addons/kwtsms
        run: composer audit

      # 2026-10-17 07:24 +03: the private strings now come from the PRIVATE_STRINGS repo
      # secret (comma-separated), so this public file no longer contains them (task 344).
      - name: Scan for sensitive data
        env:
          PRIVATE_STRINGS: ${{ secrets.PRIVATE_STRINGS }}
        run: |
          if [ -z "$PRIVATE_STRINGS" ]; then echo "::warning::PRIVATE_STRINGS secret not set, scan skipped"; exit 0; fi
          if printf '%s' "$PRIVATE_STRINGS" | tr ',' '\n' | grep -v '^$' | grep -rnF -f - modules/addons/kwtsms/lib/ modules/addons/kwtsms/kwtsms.php modules/addons/kwtsms/hooks.php modules/addons/kwtsms/templates/ 2>/dev/null; then
            echo "::error::Sensitive data found in source files"
            exit 1
          fi
          echo "No sensitive data found"
